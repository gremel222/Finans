name = "wiki-navigator"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Привязка Workers AI — основная модель (п.3)
[ai]
binding = "AI"

# KV для rate-limit и daily cap (п.7) — создать руками:
# npx wrangler kv namespace create wiki_navigator_cache
# npx wrangler kv namespace create wiki_navigator_limits
# ID подставить ниже
# [[kv_namespaces]]
# binding = "CACHE"
# id = "<id>"
# [[kv_namespaces]]
# binding = "LIMITS"
# id = "<id>"

[vars]
# Origin — только схема+хост, без пути (поправка v4 п.2)
# Подставь свой логин: https://<логин>.github.io
ALLOWED_ORIGINS = "https://gremel222.github.io"
# DEV=1 разрешает localhost/127.0.0.1 — только в dev, не в проде
DEV = "0"

# Секреты (только опциональный Gemini, T4c):
# npx wrangler secret put GEMINI_API_KEY  (вводит человек в своём терминале)
